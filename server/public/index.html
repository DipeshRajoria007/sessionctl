<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SessionCtl - Terminal Session Manager</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1b26;
            color: #c0caf5;
            margin: 0;
            padding: 0;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3b4261;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #565f89;
        }

        /* Animation keyframes */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        .animate-slide-in {
            animation: slideIn 0.3s ease-out;
        }

        .animate-pulse-custom {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .animate-spin-custom {
            animation: spin 1s linear infinite;
        }

        /* Tailwind customization for colors */
        .bg-surface {
            background-color: #24283b;
        }

        .bg-surface-hover {
            background-color: #292e42;
        }

        .border-primary {
            border-color: #3b4261;
        }

        .text-muted {
            color: #565f89;
        }

        .text-accent {
            color: #7aa2f7;
        }

        .bg-accent {
            background-color: #7aa2f7;
        }

        .bg-accent-hover:hover {
            background-color: #6b96d1;
        }

        .text-success {
            color: #9ece6a;
        }

        .bg-success {
            background-color: #9ece6a;
        }

        .text-danger {
            color: #f7768e;
        }

        .bg-danger {
            background-color: #f7768e;
        }

        .text-warning {
            color: #e0af68;
        }

        .bg-warning {
            background-color: #e0af68;
        }

        .text-purple {
            color: #bb9af7;
        }

        .bg-purple {
            background-color: #bb9af7;
        }

        .text-cyan {
            color: #7dcfff;
        }

        .bg-cyan {
            background-color: #7dcfff;
        }

        .text-orange {
            color: #ff9e64;
        }

        .bg-orange {
            background-color: #ff9e64;
        }

        /* Dialog overlay */
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .dialog-content {
            background: #24283b;
            border: 1px solid #3b4261;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease-out;
        }

        /* Smooth transitions */
        .transition-all {
            transition: all 0.3s ease-out;
        }

        .transition-colors {
            transition: background-color 0.2s ease-out, border-color 0.2s ease-out, color 0.2s ease-out;
        }

        /* Status indicator */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.running {
            background-color: #9ece6a;
        }

        .status-dot.idle {
            background-color: #565f89;
        }

        .status-dot.exited {
            background-color: #f7768e;
        }

        /* Tool badges */
        .tool-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tool-badge.claude {
            background-color: rgba(255, 158, 100, 0.1);
            color: #ff9e64;
        }

        .tool-badge.codex {
            background-color: rgba(158, 206, 106, 0.1);
            color: #9ece6a;
        }

        .tool-badge.aider {
            background-color: rgba(187, 154, 247, 0.1);
            color: #bb9af7;
        }

        .tool-badge.git {
            background-color: rgba(247, 118, 142, 0.1);
            color: #f7768e;
        }

        .tool-badge.npm {
            background-color: rgba(224, 175, 104, 0.1);
            color: #e0af68;
        }

        .tool-badge.other {
            background-color: rgba(125, 207, 255, 0.1);
            color: #7dcfff;
        }

        /* Session row hover */
        .session-row {
            border-left: 3px solid transparent;
            transition: all 0.2s ease-out;
        }

        .session-row:hover {
            background-color: #292e42;
            border-left-color: #7aa2f7;
        }

        .session-row.focused {
            background-color: rgba(122, 162, 247, 0.1);
            border-left-color: #7aa2f7;
        }

        /* Input styles */
        input, textarea, select {
            background-color: #24283b;
            border: 1px solid #3b4261;
            color: #c0caf5;
            border-radius: 6px;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 14px;
            transition-colors 0.2s ease-out;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #7aa2f7;
            box-shadow: 0 0 0 3px rgba(122, 162, 247, 0.1);
        }

        input::placeholder {
            color: #565f89;
        }

        /* Button styles */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease-out;
            gap: 6px;
        }

        .btn-primary {
            background-color: #7aa2f7;
            color: white;
        }

        .btn-primary:hover {
            background-color: #6b96d1;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #292e42;
            color: #c0caf5;
            border: 1px solid #3b4261;
        }

        .btn-secondary:hover {
            background-color: #3b4261;
        }

        .btn-danger {
            background-color: #f7768e;
            color: white;
        }

        .btn-danger:hover {
            background-color: #d95f75;
        }

        /* Context menu */
        .context-menu {
            position: absolute;
            background: #24283b;
            border: 1px solid #3b4261;
            border-radius: 6px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 2000;
            min-width: 180px;
            animation: fadeIn 0.15s ease-out;
        }

        .context-menu-item {
            padding: 8px 12px;
            cursor: pointer;
            border: none;
            background: none;
            color: #c0caf5;
            width: 100%;
            text-align: left;
            font-size: 14px;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
            transition-colors 0.2s ease-out;
        }

        .context-menu-item:hover {
            background-color: #292e42;
        }

        .context-menu-item:first-child {
            border-radius: 6px 6px 0 0;
        }

        .context-menu-item:last-child {
            border-radius: 0 0 6px 6px;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #3b4261;
            border-top-color: #7aa2f7;
            border-radius: 50%;
            animation: spin-custom 0.8s linear infinite;
        }

        /* Connection status badge */
        .connection-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .connection-badge.connected {
            background-color: rgba(158, 206, 106, 0.1);
            color: #9ece6a;
        }

        .connection-badge.disconnected {
            background-color: rgba(247, 118, 142, 0.1);
            color: #f7768e;
        }

        .connection-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .connection-dot.connected {
            background-color: #9ece6a;
            animation: pulse-custom 2s ease-in-out infinite;
        }

        .connection-dot.disconnected {
            background-color: #f7768e;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        // Utility functions
        const timeAgo = (date) => {
            const seconds = Math.floor((new Date() - new Date(date)) / 1000);
            if (seconds < 60) return 'now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h`;
            const days = Math.floor(hours / 24);
            return `${days}d`;
        };

        const formatCommand = (cmd) => {
            if (!cmd) return '—';
            if (cmd.length > 40) return cmd.substring(0, 37) + '...';
            return cmd;
        };

        const fuzzyMatch = (query, text) => {
            const lowerQuery = query.toLowerCase();
            const lowerText = text.toLowerCase();
            if (!lowerQuery) return true;

            let queryIndex = 0;
            for (let i = 0; i < lowerText.length; i++) {
                if (lowerText[i] === lowerQuery[queryIndex]) {
                    queryIndex++;
                }
            }
            return queryIndex === lowerQuery.length;
        };

        // WebSocket hook
        const useWebSocket = () => {
            const [state, setState] = useState(null);
            const [connected, setConnected] = useState(false);
            const wsRef = useRef(null);
            const reconnectCountRef = useRef(0);
            const reconnectTimeoutRef = useRef(null);

            const connect = useCallback(() => {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws`;

                try {
                    wsRef.current = new WebSocket(wsUrl);

                    wsRef.current.onopen = () => {
                        setConnected(true);
                        reconnectCountRef.current = 0;
                    };

                    wsRef.current.onmessage = (event) => {
                        try {
                            const message = JSON.parse(event.data);
                            if (message.type === 'state') {
                                setState(message.data);
                            } else if (message.type === 'event') {
                                setState((prevState) => ({
                                    ...prevState,
                                    ...message.appState
                                }));
                            }
                        } catch (error) {
                            console.error('Failed to parse WebSocket message:', error);
                        }
                    };

                    wsRef.current.onclose = () => {
                        setConnected(false);
                        scheduleReconnect();
                    };

                    wsRef.current.onerror = (error) => {
                        console.error('WebSocket error:', error);
                        setConnected(false);
                    };
                } catch (error) {
                    console.error('Failed to create WebSocket:', error);
                    scheduleReconnect();
                }
            }, []);

            const scheduleReconnect = useCallback(() => {
                if (reconnectTimeoutRef.current) {
                    clearTimeout(reconnectTimeoutRef.current);
                }

                const delay = Math.min(1000 * Math.pow(2, reconnectCountRef.current), 30000);
                reconnectCountRef.current++;

                reconnectTimeoutRef.current = setTimeout(() => {
                    connect();
                }, delay);
            }, [connect]);

            useEffect(() => {
                connect();

                return () => {
                    if (reconnectTimeoutRef.current) {
                        clearTimeout(reconnectTimeoutRef.current);
                    }
                    if (wsRef.current) {
                        wsRef.current.close();
                    }
                };
            }, [connect]);

            return { state, connected };
        };

        // Onboarding component
        const Onboarding = ({ onComplete }) => {
            const [step, setStep] = useState(0);
            const [verifying, setVerifying] = useState(false);
            const [verified, setVerified] = useState(false);

            const handleVerify = async () => {
                setVerifying(true);
                try {
                    const response = await fetch('/api/status');
                    if (response.ok) {
                        setVerified(true);
                        setTimeout(() => {
                            if (step < 4) {
                                setStep(step + 1);
                            }
                        }, 1000);
                    }
                } catch (error) {
                    console.error('Verification failed:', error);
                } finally {
                    setVerifying(false);
                }
            };

            const steps = [
                {
                    title: 'Welcome to SessionCtl',
                    description: 'Your terminal session manager for developers.',
                    icon: 'GitBranch'
                },
                {
                    title: 'Shell Setup',
                    description: 'Add SessionCtl to your shell initialization file:',
                    code: 'eval "$(sessionctl init zsh)"',
                    icon: 'Terminal'
                },
                {
                    title: 'Verify Connection',
                    description: 'Let\'s verify your installation is working correctly.',
                    icon: 'CheckCircle',
                    action: 'Verify'
                },
                {
                    title: 'Terminal Detection',
                    description: 'SessionCtl detected your terminal: iTerm2 / Terminal.app',
                    icon: 'Monitor'
                },
                {
                    title: 'Ready to Go!',
                    description: 'You\'re all set. Start managing your sessions.',
                    icon: 'Zap'
                }
            ];

            const currentStep = steps[step];
            const getIcon = (iconName) => {
                const icons = {
                    'GitBranch': <lucide.GitBranch size={32} />,
                    'Terminal': <lucide.Terminal size={32} />,
                    'CheckCircle': <lucide.CheckCircle size={32} />,
                    'Monitor': <lucide.Monitor size={32} />,
                    'Zap': <lucide.Zap size={32} />
                };
                return icons[iconName] || null;
            };

            return (
                <div className="dialog-overlay">
                    <div className="dialog-content p-12 w-full max-w-md">
                        <div className="flex justify-center mb-6 text-accent">
                            {getIcon(currentStep.icon)}
                        </div>

                        <h2 className="text-2xl font-bold text-center mb-3">{currentStep.title}</h2>
                        <p className="text-center text-muted mb-6">{currentStep.description}</p>

                        {currentStep.code && (
                            <div className="bg-surface rounded-lg p-4 mb-6 font-mono text-sm border border-primary overflow-x-auto">
                                {currentStep.code}
                            </div>
                        )}

                        <div className="flex gap-3">
                            {step > 0 && (
                                <button
                                    onClick={() => setStep(step - 1)}
                                    className="btn btn-secondary flex-1"
                                >
                                    Back
                                </button>
                            )}

                            {step === 2 ? (
                                <button
                                    onClick={handleVerify}
                                    disabled={verifying}
                                    className="btn btn-primary flex-1"
                                >
                                    {verifying ? (
                                        <>
                                            <div className="spinner"></div>
                                            Verifying...
                                        </>
                                    ) : verified ? (
                                        <>
                                            <lucide.Check size={16} />
                                            Verified!
                                        </>
                                    ) : (
                                        'Verify Installation'
                                    )}
                                </button>
                            ) : step === 4 ? (
                                <button
                                    onClick={() => {
                                        localStorage.setItem('sessionctl_onboarding_complete', 'true');
                                        onComplete();
                                    }}
                                    className="btn btn-primary flex-1"
                                >
                                    Get Started
                                </button>
                            ) : (
                                <button
                                    onClick={() => setStep(step + 1)}
                                    className="btn btn-primary flex-1"
                                >
                                    Next
                                </button>
                            )}
                        </div>

                        <div className="flex justify-center gap-2 mt-6">
                            {steps.map((_, i) => (
                                <div
                                    key={i}
                                    className={`h-2 w-2 rounded-full transition-all ${
                                        i === step ? 'bg-accent w-6' : 'bg-primary'
                                    }`}
                                ></div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // New Session Dialog
        const NewSessionDialog = ({ isOpen, onClose }) => {
            const [repoPath, setRepoPath] = useState('');
            const [command, setCommand] = useState('');
            const [terminal, setTerminal] = useState('iTerm2');
            const [windowPref, setWindowPref] = useState('new-tab');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const response = await fetch('/api/launch', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            repoPath,
                            command: command || undefined,
                            terminal,
                            windowPreference: windowPref
                        })
                    });

                    if (response.ok) {
                        setRepoPath('');
                        setCommand('');
                        setTerminal('iTerm2');
                        setWindowPref('new-tab');
                        onClose();
                    }
                } catch (error) {
                    console.error('Failed to launch session:', error);
                } finally {
                    setLoading(false);
                }
            };

            if (!isOpen) return null;

            return (
                <div className="dialog-overlay" onClick={onClose}>
                    <div
                        className="dialog-content p-6 w-full max-w-md animate-fade-in"
                        onClick={(e) => e.stopPropagation()}
                    >
                        <div className="flex items-center justify-between mb-6">
                            <h2 className="text-xl font-bold">New Session</h2>
                            <button
                                onClick={onClose}
                                className="text-muted hover:text-accent transition-colors"
                            >
                                <lucide.X size={20} />
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium mb-2">Repository Path</label>
                                <input
                                    type="text"
                                    value={repoPath}
                                    onChange={(e) => setRepoPath(e.target.value)}
                                    placeholder="/path/to/repo"
                                    required
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium mb-2">Startup Command (optional)</label>
                                <input
                                    type="text"
                                    value={command}
                                    onChange={(e) => setCommand(e.target.value)}
                                    placeholder="e.g., npm run dev"
                                />
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium mb-2">Terminal</label>
                                    <select
                                        value={terminal}
                                        onChange={(e) => setTerminal(e.target.value)}
                                    >
                                        <option>iTerm2</option>
                                        <option>Terminal.app</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium mb-2">Window</label>
                                    <select
                                        value={windowPref}
                                        onChange={(e) => setWindowPref(e.target.value)}
                                    >
                                        <option value="new-tab">New Tab</option>
                                        <option value="new-window">New Window</option>
                                    </select>
                                </div>
                            </div>

                            <div className="flex gap-3 pt-2">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="btn btn-secondary flex-1"
                                >
                                    Cancel
                                </button>
                                <button
                                    type="submit"
                                    disabled={loading || !repoPath}
                                    className="btn btn-primary flex-1"
                                >
                                    {loading ? (
                                        <>
                                            <div className="spinner"></div>
                                            Launching...
                                        </>
                                    ) : (
                                        <>
                                            <lucide.Play size={16} />
                                            Launch
                                        </>
                                    )}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // Workspace Panel
        const WorkspacePanel = ({ isOpen, onClose }) => {
            const [workspaces, setWorkspaces] = useState([]);
            const [loading, setLoading] = useState(false);
            const [newName, setNewName] = useState('');
            const [showSaveForm, setShowSaveForm] = useState(false);

            useEffect(() => {
                if (isOpen) {
                    fetchWorkspaces();
                }
            }, [isOpen]);

            const fetchWorkspaces = async () => {
                setLoading(true);
                try {
                    const response = await fetch('/api/workspaces');
                    if (response.ok) {
                        const data = await response.json();
                        setWorkspaces(data || []);
                    }
                } catch (error) {
                    console.error('Failed to fetch workspaces:', error);
                } finally {
                    setLoading(false);
                }
            };

            const handleSave = async () => {
                if (!newName.trim()) return;

                try {
                    const response = await fetch('/api/workspaces/save-current', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newName })
                    });

                    if (response.ok) {
                        setNewName('');
                        setShowSaveForm(false);
                        fetchWorkspaces();
                    }
                } catch (error) {
                    console.error('Failed to save workspace:', error);
                }
            };

            const handleRestore = async (id) => {
                try {
                    await fetch(`/api/workspaces/${id}/restore`, { method: 'POST' });
                    fetchWorkspaces();
                } catch (error) {
                    console.error('Failed to restore workspace:', error);
                }
            };

            const handleDelete = async (id) => {
                if (!confirm('Delete this workspace?')) return;

                try {
                    await fetch(`/api/workspaces/${id}`, { method: 'DELETE' });
                    fetchWorkspaces();
                } catch (error) {
                    console.error('Failed to delete workspace:', error);
                }
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-y-0 right-0 w-80 bg-surface border-l border-primary z-50 flex flex-col">
                    <div className="flex items-center justify-between p-4 border-b border-primary">
                        <h2 className="text-lg font-bold">Workspaces</h2>
                        <button
                            onClick={onClose}
                            className="text-muted hover:text-accent transition-colors"
                        >
                            <lucide.X size={20} />
                        </button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-2">
                        {loading ? (
                            <div className="flex justify-center py-8">
                                <div className="spinner"></div>
                            </div>
                        ) : workspaces.length === 0 ? (
                            <p className="text-muted text-sm py-8 text-center">No saved workspaces</p>
                        ) : (
                            workspaces.map((ws) => (
                                <div
                                    key={ws.id}
                                    className="bg-surface-hover border border-primary rounded-lg p-3 space-y-2 hover:border-accent transition-colors"
                                >
                                    <div className="flex items-start justify-between">
                                        <div className="flex-1">
                                            <h3 className="font-medium">{ws.name}</h3>
                                            <p className="text-xs text-muted">{ws.sessionCount} sessions</p>
                                        </div>
                                        <button
                                            onClick={() => handleDelete(ws.id)}
                                            className="text-muted hover:text-danger transition-colors"
                                        >
                                            <lucide.Trash2 size={16} />
                                        </button>
                                    </div>
                                    <button
                                        onClick={() => handleRestore(ws.id)}
                                        className="w-full btn btn-secondary text-sm"
                                    >
                                        Restore
                                    </button>
                                </div>
                            ))
                        )}
                    </div>

                    <div className="p-4 border-t border-primary">
                        {showSaveForm ? (
                            <div className="space-y-2">
                                <input
                                    type="text"
                                    value={newName}
                                    onChange={(e) => setNewName(e.target.value)}
                                    placeholder="Workspace name"
                                    autoFocus
                                />
                                <div className="flex gap-2">
                                    <button
                                        onClick={() => {
                                            setShowSaveForm(false);
                                            setNewName('');
                                        }}
                                        className="btn btn-secondary flex-1"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={handleSave}
                                        className="btn btn-primary flex-1"
                                    >
                                        Save
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <button
                                onClick={() => setShowSaveForm(true)}
                                className="w-full btn btn-primary"
                            >
                                <lucide.Save size={16} />
                                Save Current
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        // Settings view
        const SettingsView = ({ onClose }) => {
            return (
                <div className="fixed inset-0 bg-surface-hover z-40 overflow-y-auto">
                    <div className="max-w-2xl mx-auto p-8">
                        <div className="flex items-center justify-between mb-8">
                            <h1 className="text-3xl font-bold">Settings</h1>
                            <button
                                onClick={onClose}
                                className="btn btn-secondary"
                            >
                                <lucide.X size={16} />
                                Close
                            </button>
                        </div>

                        <div className="space-y-8">
                            <div className="bg-surface border border-primary rounded-lg p-6">
                                <h2 className="text-xl font-bold mb-4 flex items-center gap-2">
                                    <lucide.Keyboard size={20} />
                                    Keyboard Shortcuts
                                </h2>
                                <div className="space-y-2 font-mono text-sm">
                                    <div className="flex justify-between items-center py-2 border-b border-primary">
                                        <span className="text-muted">New Session</span>
                                        <kbd className="px-3 py-1 bg-surface-hover border border-primary rounded">Cmd+N</kbd>
                                    </div>
                                    <div className="flex justify-between items-center py-2 border-b border-primary">
                                        <span className="text-muted">Quick Focus 1-9</span>
                                        <kbd className="px-3 py-1 bg-surface-hover border border-primary rounded">Cmd+1-9</kbd>
                                    </div>
                                    <div className="flex justify-between items-center py-2 border-b border-primary">
                                        <span className="text-muted">Close Dialog</span>
                                        <kbd className="px-3 py-1 bg-surface-hover border border-primary rounded">Esc</kbd>
                                    </div>
                                    <div className="flex justify-between items-center py-2">
                                        <span className="text-muted">Filter Sessions</span>
                                        <span className="text-accent">Type to search</span>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-surface border border-primary rounded-lg p-6">
                                <h2 className="text-xl font-bold mb-4 flex items-center gap-2">
                                    <lucide.Terminal size={20} />
                                    Shell Setup
                                </h2>
                                <p className="text-muted mb-4">Add SessionCtl to your shell initialization:</p>
                                <div className="bg-surface-hover rounded-lg p-4 font-mono text-sm border border-primary overflow-x-auto">
                                    eval "$(sessionctl init zsh)"
                                </div>
                                <p className="text-muted text-sm mt-4">Add this to your ~/.zshrc, ~/.bashrc, or ~/.config/fish/config.fish</p>
                            </div>

                            <div className="bg-surface border border-primary rounded-lg p-6">
                                <h2 className="text-xl font-bold mb-4 flex items-center gap-2">
                                    <lucide.Info size={20} />
                                    About
                                </h2>
                                <div className="space-y-2 text-sm">
                                    <p><span className="text-muted">SessionCtl</span> <span className="text-accent">v1.0.0</span></p>
                                    <p className="text-muted">Terminal session manager for developers</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Context menu
        const useContextMenu = () => {
            const [position, setPosition] = useState(null);
            const [sessionId, setSessionId] = useState(null);

            const showContextMenu = (e, id) => {
                e.preventDefault();
                setSessionId(id);
                setPosition({ x: e.clientX, y: e.clientY });
            };

            const hideContextMenu = () => {
                setPosition(null);
                setSessionId(null);
            };

            return { position, sessionId, showContextMenu, hideContextMenu };
        };

        // Session Row Component
        const SessionRow = ({ session, focused, onFocus, onContextMenu }) => {
            const getToolColor = (tool) => {
                const colors = {
                    'claude': 'orange',
                    'codex': 'success',
                    'aider': 'purple',
                    'git': 'danger',
                    'npm': 'warning',
                    'other': 'cyan',
                    'none': 'muted'
                };
                return colors[tool] || 'muted';
            };

            return (
                <div
                    className={`session-row px-4 py-3 flex items-center gap-3 cursor-pointer ${
                        focused ? 'focused' : ''
                    }`}
                    onClick={onFocus}
                    onContextMenu={onContextMenu}
                >
                    <div className={`status-dot ${session.status}`}></div>

                    {session.tool !== 'none' && (
                        <div className={`tool-badge ${session.tool}`}>
                            {session.tool}
                        </div>
                    )}

                    <div className="flex items-center gap-1 text-muted text-sm min-w-0">
                        <lucide.GitBranch size={14} />
                        <span className="truncate">{session.branch || 'main'}</span>
                    </div>

                    {session.mode === 'managed' && (
                        <div className="px-2 py-1 bg-accent-hover rounded text-xs font-medium">
                            managed
                        </div>
                    )}

                    <div className="flex-1 min-w-0">
                        <p className="text-sm truncate">{formatCommand(session.currentCommand)}</p>
                    </div>

                    <div className="text-xs text-muted whitespace-nowrap">
                        {timeAgo(session.lastSeenAt)}
                    </div>
                </div>
            );
        };

        // Main App
        const App = () => {
            const { state, connected } = useWebSocket();
            const [focusedSessionId, setFocusedSessionId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [newSessionOpen, setNewSessionOpen] = useState(false);
            const [workspacePanelOpen, setWorkspacePanelOpen] = useState(false);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [showOnboarding, setShowOnboarding] = useState(
                typeof window !== 'undefined' && !localStorage.getItem('sessionctl_onboarding_complete')
            );
            const contextMenu = useContextMenu();
            const searchInputRef = useRef(null);

            // Handle keyboard shortcuts
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (settingsOpen || showOnboarding) return;

                    // Cmd/Ctrl+N: New session
                    if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
                        e.preventDefault();
                        setNewSessionOpen(true);
                    }

                    // Cmd/Ctrl+1-9: Quick focus
                    if ((e.metaKey || e.ctrlKey) && e.key >= '1' && e.key <= '9') {
                        e.preventDefault();
                        const index = parseInt(e.key) - 1;
                        const allSessions = state?.groups?.flatMap(g => g.sessions) || [];
                        if (allSessions[index]) {
                            handleSessionFocus(allSessions[index].sessionId);
                        }
                    }

                    // Escape: Close dialog or panel
                    if (e.key === 'Escape') {
                        setNewSessionOpen(false);
                        setWorkspacePanelOpen(false);
                        contextMenu.hideContextMenu();
                    }

                    // Type to search
                    if (e.key.length === 1 && !e.metaKey && !e.ctrlKey && !e.altKey) {
                        if (searchInputRef.current) {
                            searchInputRef.current.focus();
                        }
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [settingsOpen, showOnboarding, state, contextMenu]);

            const handleSessionFocus = async (sessionId) => {
                setFocusedSessionId(sessionId);
                try {
                    await fetch(`/api/sessions/${sessionId}/focus`, { method: 'POST' });
                } catch (error) {
                    console.error('Failed to focus session:', error);
                }
            };

            const handleContextMenuAction = async (action) => {
                const sessionId = contextMenu.sessionId;
                contextMenu.hideContextMenu();

                try {
                    if (action === 'focus') {
                        handleSessionFocus(sessionId);
                    } else if (action === 'copy') {
                        const session = state?.groups
                            ?.flatMap(g => g.sessions)
                            .find(s => s.sessionId === sessionId);
                        if (session?.directory) {
                            navigator.clipboard.writeText(session.directory);
                        }
                    } else if (action === 'close') {
                        await fetch(`/api/sessions/${sessionId}`, { method: 'DELETE' });
                    }
                } catch (error) {
                    console.error('Action failed:', error);
                }
            };

            // Filter sessions
            const filteredGroups = useMemo(() => {
                if (!state?.groups) return [];

                return state.groups
                    .map(group => ({
                        ...group,
                        sessions: group.sessions.filter(session => {
                            const query = searchQuery.toLowerCase();
                            return (
                                fuzzyMatch(query, group.repoName) ||
                                fuzzyMatch(query, session.branch || '') ||
                                fuzzyMatch(query, session.tool || '') ||
                                fuzzyMatch(query, session.currentCommand || '')
                            );
                        })
                    }))
                    .filter(group => group.sessions.length > 0);
            }, [state?.groups, searchQuery]);

            const totalSessions = state?.totalSessions || 0;
            const runningCount = state?.groups
                ?.flatMap(g => g.sessions)
                .filter(s => s.status === 'running')
                .length || 0;

            if (showOnboarding) {
                return <Onboarding onComplete={() => setShowOnboarding(false)} />;
            }

            return (
                <div className="h-screen flex flex-col bg-base">
                    {/* Header */}
                    <header className="bg-surface border-b border-primary px-6 py-4">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-accent rounded-lg flex items-center justify-center">
                                    <lucide.GitBranch size={18} className="text-base" />
                                </div>
                                <h1 className="text-xl font-bold">SessionCtl</h1>
                                <span className="text-xs text-muted bg-surface-hover px-2 py-1 rounded">v1.0.0</span>
                            </div>

                            <div className="flex items-center gap-4">
                                <div className={`connection-badge ${connected ? 'connected' : 'disconnected'}`}>
                                    <div className={`connection-dot ${connected ? 'connected' : 'disconnected'}`}></div>
                                    {connected ? 'Live' : 'Disconnected'}
                                </div>

                                <span className="text-sm text-muted">
                                    {runningCount}/{totalSessions} sessions
                                </span>

                                <button
                                    onClick={() => setNewSessionOpen(true)}
                                    className="btn btn-primary"
                                >
                                    <lucide.Plus size={16} />
                                    New Session
                                </button>

                                <button
                                    onClick={() => setWorkspacePanelOpen(!workspacePanelOpen)}
                                    className={`btn ${workspacePanelOpen ? 'btn-primary' : 'btn-secondary'}`}
                                    title="Workspaces (Cmd+W)"
                                >
                                    <lucide.Monitor size={16} />
                                </button>

                                <button
                                    onClick={() => setSettingsOpen(!settingsOpen)}
                                    className={`btn ${settingsOpen ? 'btn-primary' : 'btn-secondary'}`}
                                    title="Settings"
                                >
                                    <lucide.Settings size={16} />
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    {settingsOpen ? (
                        <SettingsView onClose={() => setSettingsOpen(false)} />
                    ) : (
                        <div className="flex-1 flex overflow-hidden">
                            <div className="flex-1 flex flex-col overflow-hidden">
                                {/* Search Bar */}
                                <div className="px-6 py-4 border-b border-primary bg-base">
                                    <div className="relative">
                                        <lucide.Search size={16} className="absolute left-3 top-3 text-muted" />
                                        <input
                                            ref={searchInputRef}
                                            type="text"
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            placeholder="Search sessions by repo, branch, tool..."
                                            className="w-full pl-10"
                                        />
                                    </div>
                                </div>

                                {/* Sessions List */}
                                <div className="flex-1 overflow-y-auto">
                                    {!state ? (
                                        <div className="flex items-center justify-center h-full">
                                            <div className="flex flex-col items-center gap-3 text-muted">
                                                <div className="spinner"></div>
                                                <p>Connecting...</p>
                                            </div>
                                        </div>
                                    ) : filteredGroups.length === 0 && searchQuery ? (
                                        <div className="flex items-center justify-center h-full">
                                            <p className="text-muted">No sessions match your search</p>
                                        </div>
                                    ) : filteredGroups.length === 0 ? (
                                        <div className="flex items-center justify-center h-full">
                                            <div className="text-center">
                                                <lucide.Inbox size={48} className="mx-auto mb-3 text-muted opacity-50" />
                                                <p className="text-muted mb-2">No active sessions</p>
                                                <button
                                                    onClick={() => setNewSessionOpen(true)}
                                                    className="btn btn-primary"
                                                >
                                                    <lucide.Plus size={16} />
                                                    Start One
                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="space-y-6 p-6">
                                            {filteredGroups.map((group) => (
                                                <div key={group.repoName} className="animate-slide-in">
                                                    {/* Group Header */}
                                                    <div className="flex items-center gap-3 mb-3">
                                                        <lucide.Folder size={16} className="text-accent" />
                                                        <h3 className="font-semibold text-base">{group.repoName}</h3>
                                                        <span className="text-xs bg-surface-hover px-2 py-1 rounded">
                                                            {group.sessions.length} sessions
                                                        </span>
                                                        {group.sessions.some(s => s.status === 'running') && (
                                                            <span className="text-xs bg-success bg-opacity-20 text-success px-2 py-1 rounded flex items-center gap-1">
                                                                <div className="w-1.5 h-1.5 bg-success rounded-full animate-pulse-custom"></div>
                                                                Running
                                                            </span>
                                                        )}
                                                    </div>

                                                    {/* Sessions */}
                                                    <div className="border border-primary rounded-lg overflow-hidden bg-surface-hover">
                                                        {group.sessions.map((session, index) => (
                                                            <SessionRow
                                                                key={session.sessionId}
                                                                session={session}
                                                                focused={focusedSessionId === session.sessionId}
                                                                onFocus={() => handleSessionFocus(session.sessionId)}
                                                                onContextMenu={(e) => contextMenu.showContextMenu(e, session.sessionId)}
                                                            />
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}

                                            {/* Ungrouped Sessions */}
                                            {state?.ungrouped?.length > 0 && (
                                                <div className="animate-slide-in">
                                                    <div className="flex items-center gap-3 mb-3">
                                                        <lucide.Circle size={16} className="text-muted" />
                                                        <h3 className="font-semibold text-base">Ungrouped</h3>
                                                        <span className="text-xs bg-surface-hover px-2 py-1 rounded">
                                                            {state.ungrouped.length}
                                                        </span>
                                                    </div>

                                                    <div className="border border-primary rounded-lg overflow-hidden bg-surface-hover">
                                                        {state.ungrouped.map((session) => (
                                                            <SessionRow
                                                                key={session.sessionId}
                                                                session={session}
                                                                focused={focusedSessionId === session.sessionId}
                                                                onFocus={() => handleSessionFocus(session.sessionId)}
                                                                onContextMenu={(e) => contextMenu.showContextMenu(e, session.sessionId)}
                                                            />
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Workspace Panel */}
                            {workspacePanelOpen && (
                                <WorkspacePanel
                                    isOpen={workspacePanelOpen}
                                    onClose={() => setWorkspacePanelOpen(false)}
                                />
                            )}
                        </div>
                    )}

                    {/* Context Menu */}
                    {contextMenu.position && (
                        <>
                            <div
                                className="fixed inset-0 z-40"
                                onClick={contextMenu.hideContextMenu}
                            ></div>
                            <div
                                className="context-menu z-50"
                                style={{
                                    top: `${contextMenu.position.y}px`,
                                    left: `${contextMenu.position.x}px`
                                }}
                            >
                                <button
                                    className="context-menu-item"
                                    onClick={() => handleContextMenuAction('focus')}
                                >
                                    <lucide.Focus size={16} />
                                    Focus
                                </button>
                                <button
                                    className="context-menu-item"
                                    onClick={() => handleContextMenuAction('copy')}
                                >
                                    <lucide.Copy size={16} />
                                    Copy Path
                                </button>
                                <button
                                    className="context-menu-item"
                                    onClick={() => handleContextMenuAction('close')}
                                >
                                    <lucide.Trash2 size={16} />
                                    Close Session
                                </button>
                            </div>
                        </>
                    )}

                    {/* Dialogs */}
                    <NewSessionDialog
                        isOpen={newSessionOpen}
                        onClose={() => setNewSessionOpen(false)}
                    />
                </div>
            );
        };

        // Render app
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
